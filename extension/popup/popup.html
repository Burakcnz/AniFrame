<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AniFrame</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:420px; min-height:200px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#0f0f1a; color:#e0e0e0; font-size:12px; }
.header { padding:14px 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid rgba(255,255,255,0.05); }
.logo { font-size:16px; font-weight:700; background:linear-gradient(135deg,#8b5cf6,#10b981); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.version { font-size:10px; color:#666; }
.status-bar { padding:10px 16px; display:flex; align-items:center; gap:8px; border-bottom:1px solid rgba(255,255,255,0.05); font-size:11px; }
.status-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.status-dot.on { background:#10b981; box-shadow:0 0 6px #10b98166; animation:pulse 2s infinite; }
.status-dot.off { background:#f59e0b; }
.status-dot.err { background:#ef4444; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* Tabs */
.tabs { display:flex; border-bottom:1px solid rgba(255,255,255,0.05); }
.tab { flex:1; padding:8px; text-align:center; cursor:pointer; font-size:11px; font-weight:500; color:#666; transition:all 0.2s; border-bottom:2px solid transparent; }
.tab:hover { color:#999; }
.tab.active { color:#8b5cf6; border-bottom-color:#8b5cf6; }
.tab .badge { background:rgba(139,92,246,0.2); color:#8b5cf6; padding:1px 5px; border-radius:8px; font-size:9px; margin-left:4px; }

/* Video list */
.body { max-height:350px; overflow-y:auto; padding:8px; }
.body::-webkit-scrollbar { width:4px; }
.body::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:2px; }
.empty { text-align:center; padding:40px 0; color:#4a4a50; font-size:12px; }
.video-item { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; margin-bottom:4px; background:rgba(255,255,255,0.02); transition:background 0.2s; }
.video-item:hover { background:rgba(255,255,255,0.05); }
.video-icon { font-size:18px; flex-shrink:0; }
.video-info { flex:1; min-width:0; }
.video-name { font-size:12px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.video-meta { font-size:10px; color:#666; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.btn { padding:5px 10px; border:none; border-radius:6px; cursor:pointer; font-size:11px; font-weight:500; transition:all 0.2s; }
.btn-primary { background:linear-gradient(135deg,#8b5cf6,#10b981); color:#fff; }
.btn-primary:hover { filter:brightness(1.15); }
.btn-secondary { background:rgba(255,255,255,0.08); color:#c0c0c0; }
.btn-secondary:hover { background:rgba(255,255,255,0.14); }
.btn-sm { padding:3px 8px; font-size:10px; }

/* Log viewer */
.log-toolbar { display:flex; gap:4px; padding:6px 8px; border-bottom:1px solid rgba(255,255,255,0.05); flex-wrap:wrap; align-items:center; }
.log-filter { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#e0e0e0; padding:3px 6px; border-radius:4px; font-size:10px; }
.log-filter:focus { border-color:#8b5cf6; outline:none; }
.log-stats { font-size:9px; color:#666; margin-left:auto; }
.log-container { max-height:320px; overflow-y:auto; padding:4px 8px; font-family:'Cascadia Code','Fira Code',monospace; font-size:10px; line-height:1.6; }
.log-container::-webkit-scrollbar { width:4px; }
.log-container::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:2px; }
.log-entry { padding:2px 4px; border-radius:3px; word-break:break-all; }
.log-entry:hover { background:rgba(255,255,255,0.03); }
.log-time { color:#555; }
.log-level { font-weight:600; min-width:44px; display:inline-block; }
.log-level.DEBUG { color:#6b7280; }
.log-level.INFO { color:#3b82f6; }
.log-level.WARN { color:#f59e0b; }
.log-level.ERROR { color:#ef4444; }
.log-cat { color:#8b5cf6; }
.log-msg { color:#d1d5db; }

.footer { padding:10px 16px; display:flex; gap:8px; border-top:1px solid rgba(255,255,255,0.05); }
.footer .btn { flex:1; text-align:center; }
</style>
</head>
<body>
<div class="header">
  <span class="logo">AniFrame</span>
  <span class="version">v2.0</span>
</div>
<div class="status-bar">
  <span class="status-dot" id="statusDot"></span>
  <span id="statusText">Kontrol ediliyor...</span>
</div>

<div class="tabs">
  <div class="tab active" data-tab="videos">🎬 Videolar <span class="badge" id="videoCount">0</span></div>
  <div class="tab" data-tab="logs">📋 Loglar <span class="badge" id="logCount">0</span></div>
</div>

<div id="tab-videos" class="body">
  <div class="empty">Video aranıyor...</div>
</div>

<div id="tab-logs" style="display:none">
  <div class="log-toolbar">
    <select class="log-filter" id="logLevelFilter">
      <option value="">Tüm Seviyeler</option>
      <option value="ERROR">❌ ERROR</option>
      <option value="WARN">⚠️ WARN</option>
      <option value="INFO">ℹ️ INFO</option>
      <option value="DEBUG">🔍 DEBUG</option>
    </select>
    <input class="log-filter" id="logSearchFilter" placeholder="Ara..." style="flex:1;min-width:80px">
    <button class="btn btn-sm btn-secondary" id="btnCopyLogs" title="Panoya kopyala">📋</button>
    <button class="btn btn-sm btn-secondary" id="btnExportLogs" title="Dosyaya kaydet">💾</button>
    <button class="btn btn-sm btn-secondary" id="btnClearLogs" title="Temizle">🗑️</button>
    <span class="log-stats" id="logStats"></span>
  </div>
  <div class="log-container" id="logContainer">
    <div class="empty">Log bulunamadı</div>
  </div>
</div>

<div class="footer">
  <button class="btn btn-primary" id="btnAll">Tümünü Kuyruğa Ekle</button>
  <button class="btn btn-secondary" id="btnOpen">AniFrame'de Aç</button>
  <button class="btn btn-secondary" id="btnSettings">⚙️</button>
</div>
<script src="popup.js"></script>
</body>
</html>
